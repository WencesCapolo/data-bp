services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: basket_analytics
      POSTGRES_USER: basket
      POSTGRES_PASSWORD: basket_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basket -d basket_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
